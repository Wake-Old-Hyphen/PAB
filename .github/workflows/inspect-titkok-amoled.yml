name: Inspect TikTok AMOLED resources (V3)

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated stock TikTok versions"
        default: "47.0.3"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -L -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar

      - name: Download and decode stock APKs
        run: |
          set -euo pipefail
          IFS=',' read -ra versions <<< "${{ github.event.inputs.versions }}"
          mkdir -p work

          for v in "${versions[@]}"; do
            v="$(echo "$v" | tr -d '[:space:]')"
            [ -n "$v" ] || continue
            echo "::group::TikTok $v"
            url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/stock-tiktok-apk" \
              --jq '.assets[] | "\(.name) \(.browser_download_url)"' \
              | grep "com.zhiliaoapp.musically_${v}" \
              | grep "\.apk$" \
              | head -n1 \
              | awk '{print $2}' || true)"
            if [ -z "$url" ]; then echo "::error::No uploaded stock APK for $v"; exit 1; fi
            echo "Downloading TikTok $v..."
            curl -L -H "Authorization: Bearer ${GH_TOKEN}" -o "work/base_${v}.apk" "$url"
            java -Xmx4g -jar apktool.jar d -s -f -o "work/decoded_${v}" "work/base_${v}.apk"
            echo "::endgroup::"
          done

      - name: Build V3 AMOLED candidate report
        run: |
          set -euo pipefail
          IFS=',' read -ra versions <<< "${{ github.event.inputs.versions }}"
          report="amoled-resource-report.txt"
          : > "$report"

          for v in "${versions[@]}"; do
            v="$(echo "$v" | tr -d '[:space:]')"
            [ -n "$v" ] || continue
            d="work/decoded_${v}"

            {
              echo "# TikTok $v V3 AMOLED candidates"
              echo
              
              echo "## 1. Styles referencing the MISSING #161823 and #1e1e1e colors"
              echo "(These are likely the background attributes for the Followers sheet)"
              grep -R -nE '<item name="[^"]+">@color/(bi|cu|da|dd|ff|fu|kn|kp|op|uf|x1|a05|a1o|a5_|a5i|a7b|a7e|a82|a8m|a_g|aa0|aaa|u0|a3_|a3q|a3x)' "$d"/res/values* || true

              echo
              echo "## 2. Layout XML dumps for known sheet layouts (a24, a4b, b79)"
              echo "(Look at the root container's android:background or style here)"
              for layout_name in a24 a4b b79 a3z a41 a42 a44; do
                f="$d/res/layout/${layout_name}.xml"
                if [ -f "$f" ]; then
                  echo "========================================="
                  echo "FILE: $f"
                  echo "========================================="
                  cat "$f"
                  echo
                fi
              done

              echo
              echo "## 3. All style items with literal dark hex codes (fallback)"
              grep -R -nE '<item name="[^"]+">#([fF][fF])?(161823|1e1e1e|252525|121212|2e2e2e|212121|181818)</item>' "$d"/res/values* || true

              echo
            } >> "$report"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: amoled-resource-report-v3
          path: amoled-resource-report.txt
          retention-days: 14