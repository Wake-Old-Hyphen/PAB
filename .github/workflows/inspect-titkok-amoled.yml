name: Inspect TikTok AMOLED resources

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated stock TikTok versions"
        default: "47.0.3"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -L -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar

      - name: Download and decode stock APKs
        run: |
          set -euo pipefail

          IFS=',' read -ra versions <<< "${{ github.event.inputs.versions }}"
          mkdir -p work

          for v in "${versions[@]}"; do
            v="$(echo "$v" | tr -d '[:space:]')"
            [ -n "$v" ] || continue

            echo "::group::TikTok $v"

            url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/stock-tiktok-apk" \
              --jq '.assets[] | "\(.name) \(.browser_download_url)"' \
              | grep "com.zhiliaoapp.musically_${v}" \
              | grep "\.apk$" \
              | head -n1 \
              | awk '{print $2}' || true)"

            if [ -z "$url" ]; then
              echo "::error::No uploaded stock APK for $v"
              exit 1
            fi

            echo "Downloading TikTok $v..."
            curl -L -H "Authorization: Bearer ${GH_TOKEN}" -o "work/base_${v}.apk" "$url"

            # -s = do not decode source/smali, only decode resources.
            java -Xmx4g -jar apktool.jar d -s -f -o "work/decoded_${v}" "work/base_${v}.apk"

            echo "::endgroup::"
          done

      - name: Build AMOLED candidate report
        run: |
          set -euo pipefail

          IFS=',' read -ra versions <<< "${{ github.event.inputs.versions }}"
          report="amoled-resource-report.txt"
          : > "$report"

          for v in "${versions[@]}"; do
            v="$(echo "$v" | tr -d '[:space:]')"
            [ -n "$v" ] || continue

            d="work/decoded_${v}"

            {
              echo "# TikTok $v AMOLED candidates"
              echo

              echo "## 1. Known Hushfeed 47.0.3 background colors (from author's commits)"
              for id in a3z a41 a42 a44 a4b; do
                grep -R -n "<color name=\"$id\"" "$d"/res/values* || true
              done

              echo
              echo "## 2. Known Hushfeed 47.0.3 sheet style items (from author's commits)"
              for id in a24 b79; do
                grep -R -n "<item name=\"$id\"" "$d"/res/values* || true
              done
              
              echo
              echo "## 3. Layouts related to Friends/Followers/Social (FULL DUMP)"
              echo "(Look at the root container's android:background or style attribute here)"
              find "$d/res/layout" -type f \( -iname "*friend*" -o -iname "*follow*" -o -iname "*relation*" -o -iname "*social*" -o -iname "*suggest*" -o -iname "*profile_user*" \) | while read f; do
                echo "========================================="
                echo "FILE: $f"
                echo "========================================="
                cat "$f"
                echo
              done || true

              echo
              echo "## 4. Styles mapping to the new 47.0.3 dark colors"
              grep -R -nE '<item name="[^"]+">@color/(a3z|a41|a42|a44|a4b)' "$d"/res/values* || true

              echo
              echo "## 5. Attributes defined as the known sheet colors"
              grep -R -nE 'name="(a3z|a41|a42|a44|a4b|a24|b79)"' "$d"/res/values* || true

              echo
              echo "## 6. Common dark color resources (for fallback)"
              grep -R -nE '<color name="[^"]+">#([fF][fF])?(000000|0[0-9a-fA-F]{5}|1[0-9a-fA-F]{5}|2[0-9a-fA-F]{5}|3[0-9a-fA-F]{5}|404040)</color>' \
                "$d"/res/values* | head -n 2000 || true

              echo
              echo
            } >> "$report"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: amoled-resource-report
          path: amoled-resource-report.txt
          retention-days: 14