name: Build Single TikTok (One-Time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests pyyaml beautifulsoup4 curl_cffi

      # Keep the SAME secret names your main workflow uses
      - name: Decode keystore
        run: |
          mkdir -p signing
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > signing/keystore.jks

      # Swap in the one-time config (runner-only, never committed)
      - name: Use one-time config
        run: cp config-onetime.yaml config.yaml

      - name: Build APKs
        run: python build.py
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      # Safety net: APK is always retrievable even if publishing fails
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: single-tiktok-apk
          path: build/*-patched.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: single-tiktok-notes
          path: release_notes.md
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: single-tiktok-apk
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: single-tiktok-notes
          path: notes

      # Single file upload with retries = no Unicorn crashes
      - name: Create release and upload with retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="single-tiktok-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" --title "$TAG" --notes-file notes/release_notes.md
          for f in dist/*.apk; do
            ok=0
            for i in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber; then
                echo "✅ uploaded $f"; ok=1; break
              fi
              echo "attempt $i failed, retrying in 20s"; sleep 20
            done
            [ "$ok" = "1" ] || exit 1
          done