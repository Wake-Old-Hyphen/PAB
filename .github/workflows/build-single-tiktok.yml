name: Build Single TikTok (One-Time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests pyyaml beautifulsoup4 curl_cffi

      - name: Decode keystore
        run: |
          mkdir -p signing
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > signing/keystore.jks

      - name: Use one-time config
        run: |
          if [ ! -f config-onetime.yaml ]; then
            echo "❌ ERROR: config-onetime.yaml is missing from your repository!"
            exit 1
          fi
          cp config-onetime.yaml config.yaml

      - name: Build APK
        run: python build.py
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Create Release and Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if APK actually exists before trying to upload
          if ! ls build/*-patched.apk 1> /dev/null 2>&1; then
            echo "❌ ERROR: build.py did not create any -patched.apk files!"
            echo "Check the 'Build APK' step logs above to see why it failed."
            exit 1
          fi

          TAG="single-tiktok-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" --title "$TAG" --notes-file release_notes.md
          
          # Upload with retries to prevent Unicorn timeout errors
          for f in build/*-patched.apk; do
            ok=0
            for i in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber; then
                echo "✅ uploaded $f"; ok=1; break
              fi
              echo "attempt $i failed, retrying in 20s"; sleep 20
            done
            [ "$ok" = "1" ] || exit 1
          done