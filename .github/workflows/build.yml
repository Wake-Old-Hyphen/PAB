name: Build and Release (Batch)

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests pyyaml beautifulsoup4 curl_cffi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "❌ ERROR: KEYSTORE_BASE64 secret is EMPTY or MISSING! Check your repo secrets."
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > signing/keystore.jks
          SIZE=$(stat -c%s signing/keystore.jks)
          echo "keystore.jks size: ${SIZE} bytes"
          if [ "${SIZE}" -lt 100 ]; then
            echo "❌ ERROR: keystore.jks too small (${SIZE} bytes) — decode failed!"
            exit 1
          fi

      - name: Build APKs
        run: python build.py
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-apks
          path: build/*-patched.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release notes as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: patched-apks
          path: dist

      - name: Download notes artifact
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes

      - name: Generate release tag
        id: tag
        run: echo "TAG=build-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.tag.outputs.TAG }}" --title "${{ steps.tag.outputs.TAG }}" --notes-file notes/release_notes.md

      - name: Upload assets with retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in dist/*.apk; do
            ok=0
            for i in 1 2 3 4 5; do
              if gh release upload "${{ steps.tag.outputs.TAG }}" "$f" --clobber; then
                echo "✅ uploaded $f"; ok=1; break
              fi
              echo "attempt $i failed for $f, retrying in 20s"; sleep 20
            done
            [ "$ok" = "1" ] || exit 1
          done