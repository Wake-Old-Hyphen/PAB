name: Build and Release (Batch)

on:
  workflow_dispatch:
    inputs:
      plan_only:
        description: "Only resolve versions + emit plan (no builds, no release)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * *"   # adjust to your preferred schedule

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests pyyaml beautifulsoup4 curl_cffi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "❌ ERROR: KEYSTORE_BASE64 secret is EMPTY or MISSING!"
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > signing/keystore.jks
          SIZE=$(stat -c%s signing/keystore.jks)
          if [ "${SIZE}" -lt 100 ]; then
            echo "❌ ERROR: keystore.jks too small (${SIZE} bytes)!"
            exit 1
          fi

      - name: Plan only (resolve versions, no builds)
        if: ${{ inputs.plan_only }}
        run: python build.py --plan
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload plan artifacts
        if: ${{ inputs.plan_only }}
        uses: actions/upload-artifact@v4
        with:
          name: version-plan
          path: |
            plan.json
            resolution_report.md
          retention-days: 14

      - name: Full batch build
        if: ${{ !inputs.plan_only }}
        run: python build.py
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release and upload with retry
        if: ${{ !inputs.plan_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls build/*-patched.apk 1> /dev/null 2>&1; then
            echo "❌ ERROR: build.py did not create any -patched.apk files!"
            exit 1
          fi
          TAG="build-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" --title "Morphe AutoBuilds ($TAG)" --notes-file release_notes.md
          for f in build/*-patched.apk; do
            ok=0
            for i in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber; then
                echo "✅ uploaded $f"; ok=1; break
              fi
              echo "attempt $i failed for $f, retrying in 20s"; sleep 20
            done
            [ "$ok" = "1" ] || exit 1
          done