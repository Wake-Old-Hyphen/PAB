apk_version: latest
source: apkeep
# No clone_package or app_name defined -> keeps original com.mobond.mindicator / "Mindicator"

strip_permissions:
  - android.permission.ACCESS_NETWORK_STATE
  - android.permission.ACCESS_WIFI_STATE
  - android.permission.INTERNET
  - android.permission.WAKE_LOCK
  - android.permission.ACCESS_COARSE_UPDATES
  - android.permission.SCHEDULE_EXACT_ALARM
  - com.android.alarm.permission.SET_ALARM
  - android.permission.FOREGROUND_SERVICE

bundles:
  - url: https://raw.githubusercontent.com/hxreborn/morphe-patches/main/patches-bundle.json
    label: HXReborn
    patches:
      - Remove Ads
      - Disable Analytics
  - url: https://raw.githubusercontent.com/Nai64/Nai64ExtraPatches/main/patches-bundle.json
    label: Nai64
    patches:
      - Remove Ads
      - Disable Analytics
      - Empty Clipboard Report