meta:
  version: 2
  resolution_report: true

defaults:
  auto_include_new_patches: true
  exclude_patches: []
  abi: arm64-v8a
  density: ["xxhdpi"]
  languages: ["en"]
  keep_all_abis: false
  version_policy: pin
  refresh_after_days: 7

# ---------- BUNDLE REGISTRY ----------
bundles:
  kveld9:        {url: "https://raw.githubusercontent.com/kveld9/kveld-morphe-patches/main/patches-bundle.json"}
  hushfeed:      {url: "https://raw.githubusercontent.com/SysAdminDoc/hushfeed/main/patches-bundle.json"}
  hushfeed-mine: {url: "https://raw.githubusercontent.com/Wake-Old-Hyphen/hushfeed/main/patches-bundle.json"}
  nai64-extra:   {url: "https://raw.githubusercontent.com/Nai64/Nai64ExtraPatches/main/patches-bundle.json"}
  morphe:        {url: "https://raw.githubusercontent.com/MorpheApp/morphe-patches/main/patches-bundle.json"}
  dh6k:          {url: "https://raw.githubusercontent.com/dh6k/morphe-patches/main/patches-bundle.json"}
  anddea:        {url: "https://raw.githubusercontent.com/anddea/revanced-patches/dev/patches-bundle.json"}
  adobo:         {url: "https://raw.githubusercontent.com/jkennethcarino/adobo/main/patches-bundle.json"}
  hxreborn:      {url: "https://raw.githubusercontent.com/hxreborn/morphe-patches/main/patches-bundle.json"}
  icysymmetra:   {url: "https://revanced-external-bundles.brosssh.com/api/v2/bundle/icysymmetra/tiktok-patches-for-morphe/latest?channel=prerelease"}
  rushiranpise:  {url: "https://raw.githubusercontent.com/rushiranpise/morphe-patches/main/patches-bundle.json"}
  kondratjev:    {url: "https://raw.githubusercontent.com/kondratjev/morphe-patches/main/patches-bundle.json"}
  paresh:        {url: "https://gitlab.com/Paresh-Maheshwari/paresh-patches/-/raw/main/patches-bundle.json"}
  gemini-microg: {url: "https://raw.githubusercontent.com/ryuya0124/gemini-microg-patches/main/patches-bundle.json"}

# ---------- APP REGISTRY ----------
apps:
  tiktok:
    package: com.zhiliaoapp.musically
    source: {kind: upload, tag: stock-tiktok-apk, fallback: apkmirror}
    version_policy: latest_available
    density: ["nodpi"]
  brave:
    package: com.brave.browser
    source: {kind: github-releases, repo: brave/brave-browser}
    version_policy: latest
  reddit:
    package: com.reddit.frontpage
    source: {kind: apkeep, fallback: apkmirror}
    version_policy: follow
  youtube:
    package: com.google.android.youtube
    source: {kind: upload, tag: stock-tiktok-apk, fallback: apkeep}
    density: ["332dpi", "xhdpi", "xxhdpi"]
  ytmusic:
    package: com.google.android.apps.youtube.music
    source: {kind: upload, tag: stock-tiktok-apk}
    density: ["332dpi", "xhdpi", "xxhdpi"]
  google:
    package: com.google.android.googlequicksearchbox
    source: {kind: upload, tag: stock-tiktok-apk}
    density: ["332dpi", "xhdpi", "xxhdpi"]
    keep_all_abis: true
  gemini:
    package: com.google.android.apps.bard
    source: {kind: upload, tag: stock-tiktok-apk}
    density: ["332dpi", "xhdpi", "xxhdpi"]
    keep_all_abis: true
  windscribe: {package: com.windscribe.vpn,    source: {kind: apkeep}, version_policy: latest, density: ["332dpi", "xhdpi", "xxhdpi"]}
  protonmail: {package: ch.protonmail.android, source: {kind: apkeep}, version_policy: latest, density: ["332dpi", "xhdpi", "xxhdpi"]}
  protonvpn:
    package: ch.protonvpn.android
    source: {kind: github-releases, repo: ProtonVPN/android-app, fallbacks: ["f-droid", "apkeep"]}
    version_policy: latest
    density: ["332dpi", "xhdpi", "xxhdpi"]
  mindicator:
    package: com.mobond.mindicator
    source: {kind: apkeep}
    version_policy: latest
    density: ["nodpi", "xxhdpi"]

# ---------- BUILD LIST ----------
builds:
  # ================= BRAVE (5 builds) =================
  - id: brave-mono
    app: brave
    version: follow
    fallback_version: "1.96.60"
    gh_assets: ["Bravemonoarm64.apk"]
    clone: com.brave.mono
    name: Brave Mono
    bundles:
      - kveld9:
          authority: true
          auto_include_new: false
          patches: &brave_kveld9_full
            - APK Junk Cleaner
            - Background Sync & JobScheduler Purge
            - Block Brave Telemetry
            - Brave In-Product & Commercial Notification Optimizer
            - Brave Origin
            - Brave Startup Performance Optimization
            - Clean New Tab Page
            - Clean Share URL
            - DPI Resource Slimmer
            - Disable Background Sync & Periodic Sync
            - Disable Battery Status API & OS Listener
            - Locale PAK Slimmer
            - Locale Resource Slimmer
            - Native Bloat Slimmer
            - PNG Asset Optimizer
            - Sensor Privacy Guard
            - Skip First Run
            - Suppress In-App Promos & Surveys
            - Universal Native Binary Trimmer
            - Universal Privacy Permissions Stripper
            - Universal Telemetry Neutralizer
            - Universal WebP Asset Optimizer
      - dh6k:
          auto_include_new: false
          patches: &brave_dh6k_origin
            - Brave AMOLED theme
            - Change app icon
            - Change app name
            - Custom NTP wallpaper
            - Disable analytics
      - morphe:
          auto_include_new: false
          patches:
            - Clone app
    options: &brave_opts
      "Brave AMOLED theme":
        "AMOLED background": "#000000"
        "Text color": "#f0f2ff"
        "Accent color": "#737ade"
        "Disable Material You dynamic colors": true
      "Change app icon":
        "Custom app icon": "assets/isoamoledbraveicon.png"
      "Custom NTP wallpaper":
        "Custom NTP wallpaper": "assets/000000.png"
      "Clean New Tab Page":
        "Hide Top Sites & Shortcuts": false
      "DPI Resource Slimmer":
        "DPI densities to keep": "xxhdpi"
      "Locale PAK Slimmer":
        "Locales to keep": "en-US"
      "Locale Resource Slimmer":
        "Locales to keep": "en"
      "Background Sync & JobScheduler Purge":
        "Strip RECEIVE_BOOT_COMPLETED Permission": true
        "Disable Boot & Package Receivers": true
        "Disable WorkManager & Job Schedulers": true
        "Strip WAKE_LOCK Permission": false
      "Universal Native Binary Trimmer":
        "Trim Crash Reporting Libraries": true
        "Trim Debug & Profiling Libraries": true
      "Universal Privacy Permissions Stripper":
        "Strip Notification Permission": true
        "Strip Camera Permission": true
        "Strip Microphone Permissions": true
        "Strip Storage & Media Permissions": false
        "Strip Location Permissions": true
        "Strip Contacts & Accounts Permissions": true
        "Strip Calendar Permissions": true
        "Strip Nearby Devices Permissions": true
        "Strip Body Sensors Permissions": true
      "Universal Telemetry Neutralizer":
        "Revoke Advertising & Tracking Permissions": true
        "Disable Telemetry ContentProviders": true
        "Disable Telemetry Background Services": true
        "Disable Telemetry Receivers": true
        "Inject Telemetry Opt-Out Flags": true
        "Disable Firebase Init Provider": true
      "Universal WebP Asset Optimizer":
        "Strip EXIF Metadata": true
        "Strip XMP Metadata": true
        "Strip ICC Color Profiles": false

  - id: brave-origin-stable
    app: brave
    version: follow
    fallback_version: "1.96.60"
    gh_assets: ["Bravearm64Universal.apk"]
    clone: com.brave.browser
    name: Brave Origin
    bundles:
      - dh6k:
          auto_include_new: false
          patches: *brave_dh6k_origin
      - kveld9:
          authority: true
          auto_include_new: false
          patches: &brave_kveld9_stable_universal
            - APK Junk Cleaner
            - Background Sync & JobScheduler Purge
            - Block Brave Telemetry
            - Brave In-Product & Commercial Notification Optimizer
            - Brave Startup Performance Optimization
            - Clean Share URL
            - DPI Resource Slimmer
            - Disable Background Sync & Periodic Sync
            - Disable Battery Status API & OS Listener
            - Locale PAK Slimmer
            - Locale Resource Slimmer
            - Native Bloat Slimmer
            - PNG Asset Optimizer
            - Sensor Privacy Guard
            - Skip First Run
            - Suppress In-App Promos & Surveys
            - Universal Native Binary Trimmer
            - Universal Privacy Permissions Stripper
            - Universal Telemetry Neutralizer
            - Universal WebP Asset Optimizer
    options: *brave_opts

  - id: brave-o2
    app: brave
    version: follow
    fallback_version: "1.96.60"
    gh_assets: ["Bravearm64Universal.apk"]
    clone: com.brave.origin
    name: BraveO²
    bundles:
      - dh6k:
          auto_include_new: false
          patches: *brave_dh6k_origin
      - kveld9:
          auto_include_new: false
          patches: *brave_kveld9_stable_universal
      - morphe:
          auto_include_new: false
          patches:
            - Clone app
    options: *brave_opts

  - id: brave-nightly
    app: brave
    version: "channel:nightly"
    output_name: Brave-Nightly
    gh_assets: ["Bravearm64Universal.apk"]
    bundles:
      - dh6k:
          auto_include_new: false
          patches: &brave_dh6k_nightly
            - Brave AMOLED theme
            - Brave Origin
            - Brave Startup Performance Optimization
            - Change app icon
            - Custom NTP wallpaper
            - Disable analytics
      - kveld9:
          auto_include_new: false
          patches: &brave_kveld9_universal_only
            - APK Junk Cleaner
            - Background Sync & JobScheduler Purge
            - DPI Resource Slimmer
            - Locale Resource Slimmer
            - PNG Asset Optimizer
            - Universal Native Binary Trimmer
            - Universal Privacy Permissions Stripper
            - Universal Telemetry Neutralizer
            - Universal WebP Asset Optimizer
    options: *brave_opts

  - id: brave-beta
    app: brave
    version: "channel:beta"
    output_name: Brave-Beta
    gh_assets: ["Bravearm64Universal.apk"]
    bundles:
      - dh6k:
          auto_include_new: false
          patches: *brave_dh6k_nightly
      - kveld9:
          auto_include_new: false
          patches: *brave_kveld9_universal_only
    options: *brave_opts

  # ================= TIKTOK (4 builds) =================
  - id: tiktok-hushfeed
    app: tiktok
    version: latest_available
    fallback_version: "47.1.3"
    profile: tiktok-minimal-perms
    bundles:
      - hushfeed-mine: {authority: true}
      - nai64-extra: {auto_include_new: false, patches: ["Empty Clipboard Report"]}

  - id: tiktok-kveld9
