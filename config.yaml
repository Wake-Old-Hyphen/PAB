auto_include_new_patches: true
exclude_patches: []

extra_bundles:
  - id: "kveld9"
    url: "https://raw.githubusercontent.com/kveld9/kveld-morphe-patches/main/patches-bundle.json"

variants:
  - id: "brave_origin"
    type: "stable"
    output_name: "Brave-Origin-Stable"
    clone_package: "com.brave.browser"
    app_name: "Brave Origin"

  - id: "brave_o2"
    type: "stable"
    output_name: "BraveO²-Stable"
    clone_package: "com.brave.origin"
    app_name: "BraveO²"

  - id: "brave_nightly"
    type: "nightly"
    output_name: "Brave-Nightly"
    clone_package: ""
    app_name: ""

  - id: "brave_beta"
    type: "beta"
    output_name: "Brave-Beta"
    clone_package: ""
    app_name: ""

  - id: "brave_mono"
    type: "stable"
    output_name: "Brave-Mono-Stable"
    clone_package: "com.brave.mono"
    app_name: "Brave Mono"
    exact_asset_url: "https://github.com/brave/brave-browser/releases/download/v1.95.101/Bravemonoarm64.apk"
    exact_patches:
      # dh6k (3)
      "Change app icon":
        customIcon: "assets/isoamoledbraveicon.png"
      "Change app name":
        appName: "Brave Mono"
      "Disable analytics": {}
      # official Morphe (1)
      "Clone app":
        packageName: "com.brave.mono"
        updatePermissions: true
        updateProviders: true
      # kveld9 (13)
      "APK Junk Cleaner": {}
      "Block Brave Telemetry": {}
      "Brave In-Product & Commercial Notification Optimizer": {}
      "Brave Origin": {}
      "Brave Startup Performance Optimization": {}
      "DPI Resource Slimmer": {}
      "Disable Background Sync & Periodic Sync": {}
      "Disable Battery Status API & OS Listener": {}
      "Locale PAK Slimmer": {}
      "Locale Resource Slimmer": {}
      "Native Bloat Slimmer": {}
      "PNG Asset Optimizer": {}
      "Skip First Run": {}
    bundles:
      - "dh6k"
      - "official"
      - "kveld9"

