  - id: tiktok-icysymmetra
    app: tiktok
    version: latest_available
    profile: tiktok-minimal-perms
    bundles:
      - icysymmetra: {authority: true}
      - nai64-extra: {auto_include_new: false, patches: ["Empty Clipboard Report"]}

  - id: tiktok-hxreborn
    app: tiktok
    version: latest_available
    profile: tiktok-minimal-perms
    bundles:
      - hxreborn: {authority: true}
      - nai64-extra: {auto_include_new: false, patches: ["Empty Clipboard Report"]}

  # ================= REDDIT (2) =================
  - id: reddit-morphe
    app: reddit
    version: follow
    clone: com.reddit.zixmophe
    name: RDZ
    bundles:
      - morphe: {authority: true}

  - id: reddit-adobo
    app: reddit
    version: follow
    clone: com.reddit.zixadobo
    name: RDZ Adobo
    bundles:
      - adobo: {authority: true}

  # ================= YOUTUBE / GOOGLE (5) =================
  - id: youtube-morphe
    app: youtube
    version: "21.13.164"
    clone: com.yt.zixmophe
    bundles: [morphe]

  - id: youtube-anddea
    app: youtube
    version: follow
    fallback_version: "21.13.164"
    clone: anddea.youtube.zix
    name: YouTube RVX
    exclude: ["Spoof signature", "Change version code"]
    bundles:
      - anddea: {authority: true}
    options:
      "Custom branding": {appName: "YouTube RVX"}
      "GmsCore support": {checkGmsCore: true, packageNameYouTube: "anddea.youtube.zix", patchAllManifests: true}

  - id: ytmusic-morphe
    app: ytmusic
    version: "9.15.51"
    clone: com.yt.muzik.zixmophe
    bundles: [morphe]

  - id: google-microg
    app: google
    version: "17.54.18"
    clone: com.google.android.googlequicksearchbox.morphe
    bundles: [gemini-microg, morphe]

  - id: gemini-microg
    app: gemini
    version: "1.0.958859967"
    clone: com.google.android.apps.bard.morphe
    bundles: [gemini-microg, morphe]

  # ================= VPN / MAIL / UTILITY (4) =================
  - id: windscribe-microg
    app: windscribe
    version: latest
    bundles:
      - rushiranpise: {patches: ["GmsCore support (MicroG)", "Unlock Premium"]}

  - id: protonmail-patched
    app: protonmail
    version: latest
    bundles: [hxreborn]

  - id: protonvpn-patched
    app: protonvpn
    version: latest
    bundles:
      - hxreborn:
          authority: true
          patches:
            - AMOLED dark theme
            - Custom accent color
            - Disable telemetry
            - Hide upgrade promotions
            - Override certificate pinning
            - Remove server change delay
            - Show free server locations
            - Unlock LAN connections
            - Unlock NetShield
            - Unlock connection preferences
            - Unlock custom DNS
            - Unlock profiles
            - Unlock split tunneling
      - kveld9:
          patches:
            - Background Sync & JobScheduler Purge
            - DPI Resource Slimmer
            - Locale Resource Slimmer
            - PNG Asset Optimizer
            - Universal Native Binary Trimmer
            - Universal Telemetry Neutralizer
            - Universal WebP Asset Optimizer
    options:
      "Background Sync & JobScheduler Purge":
        "Strip RECEIVE_BOOT_COMPLETED Permission": true
        "Disable Boot & Package Receivers": true
        "Disable WorkManager & Job Schedulers": true
        "Strip WAKE_LOCK Permission": false
      "DPI Resource Slimmer":
        "DPI densities to keep": "xxhdpi"
      "Locale Resource Slimmer":
        "Locales to keep": "en"

  - id: mindicator-clean
    app: mindicator
    version: latest
    profile: mindicator-minimal
    bundles:
      - hxreborn: {authority: true, patches: ["Remove Ads", "Disable Analytics"]}
      - nai64-extra: {auto_include_new: false, patches: ["Remove Ads", "Disable Analytics", "Empty Clipboard Report"]}